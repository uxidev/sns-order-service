name: build-and-push
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: login fi registry
        run: echo "${{ github.token }}" | docker login repos.futureinfra.app -u "${{ github.actor }}" --password-stdin
      - name: build
        run: docker build -t repos.futureinfra.app/futureinfra/o56ff3cbd-sns-order-service:latest .
      - name: push
        run: docker push repos.futureinfra.app/futureinfra/o56ff3cbd-sns-order-service:latest
