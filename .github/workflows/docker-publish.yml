name: build-and-push
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: login ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: build
        run: |
          docker build -t ghcr.io/uxidev/sns-order-service:latest -t ghcr.io/uxidev/sns-order-service:${{ github.sha }} .
          docker build -t ttl.sh/sns-order-service-uxi:24h .
      - name: push ghcr
        run: |
          docker push ghcr.io/uxidev/sns-order-service:latest
          docker push ghcr.io/uxidev/sns-order-service:${{ github.sha }}
      - name: push ttl.sh (public, for FutureInfra)
        run: docker push ttl.sh/sns-order-service-uxi:24h
      - name: digest
        run: docker inspect --format='{{index .RepoDigests 0}}' ttl.sh/sns-order-service-uxi:24h
