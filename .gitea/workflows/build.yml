name: build-and-push
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: whoami
        run: |
          echo "actor=${{ github.actor }} owner=${{ github.repository_owner }}"
          echo "tokenlen=${{ secrets.GITEA_TOKEN }}"
      - name: login
        run: echo "${{ secrets.GITEA_TOKEN }}" | docker login repos.futureinfra.app -u "${{ github.actor }}" --password-stdin
      - name: build
        run: docker build -t repos.futureinfra.app/futureinfra/o56ff3cbd-sns-order-service:latest .
      - name: push
        run: docker push repos.futureinfra.app/futureinfra/o56ff3cbd-sns-order-service:latest
