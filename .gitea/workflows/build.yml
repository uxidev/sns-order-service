name: build-and-push
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t ttl.sh/sns-order-service-uxi-dev:24h .
      - name: push
        run: docker push ttl.sh/sns-order-service-uxi-dev:24h
